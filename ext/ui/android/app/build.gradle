plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tphp.ui'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.tphp.ui"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // jniLibs 目录：优先用 -PtphpJniLibs=<dir> 传入（tphp.php 指向 cwd/build/android/jniLibs），
            // 未传时回退到工程内的 src/main/jniLibs
            jniLibs.srcDirs = [project.hasProperty('tphpJniLibs')
                ? project.property('tphpJniLibs')
                : 'src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
